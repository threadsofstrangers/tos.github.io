<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREADS OF STRANGERS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 12px;
  background: #000;
  color: #fff;
  font-family: "Courier New", monospace;
  font-size: 13px;
}

.page {
  max-width: 520px;
  margin: auto;
  border: 2px solid #fff;
  padding: 18px;
}

/* LOGO AREA */
.logo {
  width: 100%;
  text-align: center;
  margin: 10px 0 20px;
}

.logo img {
  display: block;
  max-width: 100%;
  max-height: 220px;
  width: auto;
  height: auto;
  margin: 0 auto;
  object-fit: contain;
}

.subtitle {
  text-align: center;
  font-size: 11px;
  margin-bottom: 20px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 88px;
  padding: 8px;
  border: 2px solid #fff;
  color: #fff;
  text-decoration: none;
  background: #000;
  transition: background .15s, color .15s;
}

.link:hover {
  background: #fff;
  color: #000;
}

.link img {
  width: 76px;
  height: 68px;
  object-fit: cover;
  border: 1px solid currentColor;
  flex-shrink: 0;
}

.link-text {
  flex: 1;
  overflow-wrap: anywhere;
}

.link-text strong {
  display: block;
  font-size: 15px;
  margin-bottom: 5px;
}

.link-text small {
  font-size: 10px;
}

footer {
  border-top: 1px dashed #fff;
  margin-top: 20px;
  padding-top: 12px;
  text-align: center;
  font-size: 10px;
  line-height: 1.8;
}

</style>
</head>

<body>
<div class="page">

  <!-- Replace images/logo.png with your logo file -->
  <div class="logo">
    <img src="images/logo.png" alt="Threads of Strangers logo">
  </div>

  <div class="subtitle">
    WEAR IT WEIRD.
  </div>

  <div class="links">

    <a class="link" href="https://threadsofstrangers.com"
       target="_blank" rel="noopener">
      <img src="images/official.jpg" alt="">
      <div class="link-text">
        <strong>01 // OFFICIAL SITE</strong>
        <small>THE MAIN EVENT →</small>
      </div>
    </a>

    <a class="link" href="YOUR_DEPOP_URL"
       target="_blank" rel="noopener">
      <img src="images/depop.jpg" alt="">
      <div class="link-text">
        <strong>02 // DEPOP SHOP</strong>
        <small>SECONDHAND STRANGENESS →</small>
      </div>
    </a>

    <a class="link" href="YOUR_ETSY_URL"
       target="_blank" rel="noopener">
      <img src="images/etsy.jpg" alt="">
      <div class="link-text">
        <strong>03 // ETSY SHOP</strong>
        <small>MORE WEIRD STUFF →</small>
      </div>
    </a>

    <a class="link" href="mailto:YOUR_EMAIL_ADDRESS">
      <img src="images/contact.jpg" alt="">
      <div class="link-text">
        <strong>04 // CONTACT US</strong>
        <small>SEND US A MESSAGE →</small>
      </div>
    </a>

  </div>

  <footer>
    YOU HAVE REACHED YOUR DESTINATION.<br>
    THREADS OF STRANGERS © 2026<br>
    <a href="https://wearweird.lol" style="color:inherit;">
      WEAR WEIRD.
    </a>
  </footer>

</div>
</body>
</html>
